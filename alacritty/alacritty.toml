[general]
import = [
]

[window]
padding = { x = 0, y = 0 }
opacity = 0.95
blur = true
decorations =  "None"
startup_mode = "Maximized"

[cursor]
style = { shape = "Beam", blinking = "On" }

[colors.primary]
background = "#1e1e1e"
foreground = "#ffffff"

[font]
size = 16.0
normal = { family = "AdwaitaMono Nerd Font", style = "Regular" }
bold = { family = "AdwaitaMono Nerd Font", style = "Bold" }
italic = { family = "AdwaitaMono Nerd Font Mono", style = "Regular Italic" }
bold_italic = { family = "AdwaitaMono Nerd Font", style = "Bold Italic" }

# [font.normal]
# family = "AdwaitaMono Nerd Font"

[terminal]
shell = "/bin/bash"

[scrolling]
history = 20000

[mouse]
hide_when_typing = true
